# Este archivo está intencionadamente casi vacío para forzar un despliegue estático
# y evitar los pipelines de build complejos de Firebase App Hosting.
# La configuración de despliegue se gestiona en firebase.json.
run:
  # No se especifica un 'build' ni un 'start' para que se sirva contenido estático.
  # La propiedad 'public' en firebase.json se encargará del resto.
  cpu: 0.1
  memoryMiB: 128
  concurrency: 1
